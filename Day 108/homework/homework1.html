<html>
    <head>
        <title>I დავალება</title>
        <link rel="stylesheet" href="homework1.css">
    </head>

    <body>
        <!--თქვენი დავალება იქნება კომენტარის სახით ახსენით თუ რაში 
        ვიყენებთ % , რა არის fr და რა არის repeat()-->
        <main>
            <!-- 1. პროცენტი (%) 
            - განსაზღვრავს ზომას მშობელი ელემენტის (კონტეინერის) მთლიანი ზომის მიმართ.
            - თუ კონტეინერი არის 1000px, 25% იქნება ზუსტად 250px.
            - მუშაობს ტრადიციულად, მაგრამ Grid-ში ხშირად იწვევს სქროლს (overflow), 
            რადგან არ ითვალისწინებს grid-gap-ის (დაშორებების) ზომას.-->

            <!-- 2. Fractional Unit (fr)
            - აღნიშნავს "თავისუფალი სივრცის წილს". 
            - ბრაუზერი ჯერ გამოაკლებს კონტეინერს ფიქსირებულ ზომებს და დაშორებებს (gap), 
            ხოლო დარჩენილ თავისუფალ ადგილს გადაანაწილებს fr-ის პროპორციულად.-->

            <!-- 3. repeat() - ფუნქცია
            - გამოიყენება კოდის შესამცირებლად, როდესაც სვეტების ან სტრიქონების 
            ზომები მეორდება.
            - პირველი პარამეტრი განსაზღვრავს რაოდენობას (რამდენჯერ განმეორდეს), 
            ხოლო მეორე — ზომას.
            - "repeat(3, 1fr)" ზუსტად იგივეა, რაც "1fr 1fr 1fr"-ის ჩაწერა. -->
        </main>
    </body>
</html>
