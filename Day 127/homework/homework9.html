    გამოიყენე trim(), რათა მოაშორო ზედმეტი გამოტოვებები.

    თუ წინადადება ცარიელია, გამოიტანე „ტექსტი არ შეგიყვანია“.

    თუ წინადადება 20 სიმბოლოზე მეტია, გამოიტანე მისი პირველი 10 სიმბოლო slice()-ის გამოყენებით.

    თუ წინადადება "!"-ით მთავრდება, გამოიტანე „ტექსტი ემოციურია“.

    თუ წინადადება "?"-ით მთავრდება, გამოიტანე „ეს შეკითხვაა“.

    თუ წინადადებაში არის "bad", შეცვალე ის "good"-ით replaceAll()-ის გამოყენებით.
