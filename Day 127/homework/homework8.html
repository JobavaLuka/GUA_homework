    <!--შექმენი პროგრამა, რომელიც მომხმარებელს შეაყვანინებს ასაკს, ბილეთის ტიპს და მომხმარებლის სახელს.

    პირობები:

    ასაკის შეყვანისას შეამოწმე, რომ ის 0-ზე მეტია.

    თუ ასაკი 12-ზე ნაკლებია, ბილეთის ფასი 5 ლარია.

    თუ ასაკი 12-დან 17 წლამდეა, ფასი 8 ლარია.

    თუ ასაკი 18 ან მეტია, ფასი 15 ლარია.

    ბილეთის ტიპი შეამოწმე toLowerCase()-ით:

    "vip" — დაამატე 10 ლარი.

    "standard" — ფასი არ შეცვალო.

    სხვა შემთხვევაში გამოიტანე „ბილეთის ტიპი არასწორია“.

    მომხმარებლის სახელს მოაშორე ზედმეტი გამოტოვებები.

    თუ სახელი "admin"-ის ტოლია, გამოიტანე „ადმინისტრატორისთვის ბილეთი უფასოა“.

    საბოლოოდ გამოიტანე მომხმარებლის სახელი და გადასახდელი თანხა.

    გაითვალისწინე, რომ არასწორი ასაკის ან ბილეთის ტიპის შემთხვევაში პროგრამამ არ უნდა გააგრძელოს ფასის გამოთვლა.-->
